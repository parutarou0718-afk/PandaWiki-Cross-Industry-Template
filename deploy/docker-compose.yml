services:
  caddy:
    container_name: panda-wiki-caddy
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    network_mode: host
    environment:
      CADDY_ADMIN: unix//var/run/caddy/caddy-admin.sock
    volumes:
      - ./data/caddy/caddy_config:/config
      - ./data/caddy/caddy_data:/data
      - ./data/caddy/run:/var/run/caddy

  nginx:
    container_name: panda-wiki-nginx
    build:
      context: ../web/admin
      dockerfile: Dockerfile
    image: pandawiki-self-hosted-nginx:latest
    restart: unless-stopped
    depends_on: [api]
    ports: ["${ADMIN_PORT}:8080"]
    volumes:
      - ./data/nginx/ssl:/etc/nginx/ssl
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.111"

  app:
    container_name: panda-wiki-app
    build:
      context: ../web/app
      dockerfile: Dockerfile
    image: pandawiki-self-hosted-app:latest
    restart: unless-stopped
    environment:
      TARGET: http://panda-wiki-api:8000
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.112"

  api:
    container_name: panda-wiki-api
    build:
      context: ../backend
      dockerfile: Dockerfile.api
      args:
        VERSION: self-hosted
    image: pandawiki-self-hosted-api:latest
    restart: unless-stopped
    depends_on: [postgres, nats, caddy, raglite]
    volumes:
      - ./data/caddy/run:/app/run
      - ./data/nginx/ssl:/app/etc/nginx/ssl
      - ./data/conf/api:/data
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.2"

  consumer:
    container_name: panda-wiki-consumer
    build:
      context: ../backend
      dockerfile: Dockerfile.consumer
    image: pandawiki-self-hosted-consumer:latest
    restart: unless-stopped
    depends_on: [nats, api, raglite]
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SUBNET_PREFIX: ${SUBNET_PREFIX}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.3"

  postgres:
    container_name: panda-wiki-postgres
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/postgres-zhparser:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "panda-wiki", "-d", "panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [./data/postgres:/var/lib/postgresql/data]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.10"

  redis:
    container_name: panda-wiki-redis
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [./data/redis:/data]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.11"

  minio:
    container_name: panda-wiki-minio
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ACCESS_KEY: s3panda-wiki
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [./data/minio:/data]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.12"

  nats:
    container_name: panda-wiki-nats
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nats:2.11.3-alpine
    restart: unless-stopped
    command: ["nats-server", "-c", "/etc/nats/nats.conf", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    volumes: [./data/nats:/data]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.13"

  qdrant:
    container_name: panda-wiki-qdrant
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-qdrant:v1.14.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: [./data/qdrant:/qdrant/storage]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.14"

  crawler:
    container_name: panda-wiki-crawler
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/anydoc:v0.9.11
    restart: unless-stopped
    init: true
    environment:
      MQ_NATS_URL: nats://panda-wiki-nats:4222
      MQ_NATS_USER: panda-wiki
      MQ_NATS_PASSWORD: ${NATS_PASSWORD}
      OSS_MINIO_ACCESS_KEY: s3panda-wiki
      OSS_MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      OSS_MINIO_ENDPOINT: panda-wiki-minio:9000
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.17"

  raglite:
    container_name: panda-wiki-raglite
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/raglite:v2.17.0
    restart: unless-stopped
    environment:
      GIN_MODE: release
      DATABASE_POSTGRESQL_HOST: panda-wiki-postgres
      DATABASE_POSTGRESQL_USER: panda-wiki
      DATABASE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_QDRANT_HOST: panda-wiki-qdrant
      DATABASE_QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_MINIO_ENDPOINT: panda-wiki-minio:9000
      STORAGE_MINIO_ACCESS_KEY_ID: s3panda-wiki
      STORAGE_MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://panda-wiki-nats:4222
      NATS_USER: panda-wiki
      NATS_PASSWORD: ${NATS_PASSWORD}
    volumes: [./data/raglite:/data]
    depends_on: [postgres, minio, qdrant]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX}.18"

networks:
  panda-wiki:
    ipam:
      config:
        - subnet: "${SUBNET_PREFIX}.0/24"
