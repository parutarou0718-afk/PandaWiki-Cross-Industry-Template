services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pandawiki_report_test
      POSTGRES_USER: pandawiki_test
      POSTGRES_PASSWORD: pandawiki_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandawiki_test -d pandawiki_report_test"]
      interval: 2s
      timeout: 3s
      retries: 20
